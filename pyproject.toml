[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trench-ai"
version = "0.1.0"
description = "The ai of trench"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "langchain[google-genai]>=0.3.27",
    "langchain-experimental>=0.0.68",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.6.5",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "uvicorn>=0.35.0",
    "langchain-community>=0.3.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
runable = "src.runable.main:start_server"

[tool.uv]
package = true
